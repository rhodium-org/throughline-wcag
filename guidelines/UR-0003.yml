title: Adaptable — Create content that can be presented in different ways (for example
  simpler layout) without losing information or structure.
text: Create content that can be presented in different ways (for example simpler
  layout) without losing information or structure.
rationale: When structure and relationships are encoded programmatically, content
  can be presented in different ways — spoken, reflowed, restyled — without losing
  meaning.
